<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="CleanMyFuckingMac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C0F38"/>
      <stop offset="0.5" stop-color="#29144D"/>
      <stop offset="1" stop-color="#0D1738"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D8C"/>
      <stop offset="0.5" stop-color="#8C5CFF"/>
      <stop offset="1" stop-color="#291F80"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D8C"/>
      <stop offset="1" stop-color="#FF9E45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4D8C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF4D8C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="230" cy="180" r="210" fill="url(#glow)"/>

  <!-- Logo: disk-usage ring with a lightning bolt -->
  <g transform="translate(130 80)">
    <rect width="200" height="200" rx="45" fill="url(#logo)"/>
    <g transform="rotate(-90 100 100)" fill="none" stroke-width="17" stroke-linecap="round">
      <circle cx="100" cy="100" r="60" stroke="#FFFFFF" pathLength="100" stroke-dasharray="70 30"/>
      <circle cx="100" cy="100" r="60" stroke="#FF9E45" pathLength="100" stroke-dasharray="16 84" stroke-dashoffset="-78"/>
    </g>
    <path d="M108 68 L80 106 H98 L92 134 L121 95 H103 Z" fill="#FFFFFF"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif">
    <text x="400" y="170" font-size="76" font-weight="800" fill="#FFFFFF">CleanMy<tspan fill="url(#accent)">FuckingMac</tspan></text>
    <text x="404" y="222" font-size="27" fill="#FFFFFF" fill-opacity="0.65">Vois ce qui bouffe ton disque. Récupère-le.</text>
    <g font-size="18" font-weight="600" fill="#FFFFFF">
      <rect x="404" y="252" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="479" y="277" text-anchor="middle">macOS 14+</text>
      <rect x="566" y="252" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="641" y="277" text-anchor="middle">SwiftUI natif</text>
      <rect x="728" y="252" width="190" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.1"/>
      <text x="823" y="277" text-anchor="middle">Zéro dépendance</text>
    </g>
  </g>
</svg>
